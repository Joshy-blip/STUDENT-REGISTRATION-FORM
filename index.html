<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>
        <p>Please complete the form below with your correct information.</p>
        <hr>
    </header>

    <main>
        <section>
            <h2>Personal and Academic Information</h2>

            <form action="#" method="post">
                <div>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name"
                           autocomplete="name" required>
                </div>

                <br>

                <div>
                    <label for="matric">Matric Number:</label><br>
                    <input type="text" id="matric" name="matric"
                           placeholder="Enter your matric number"
                           maxlength="20" required>
                </div>

                <br>

                <div>
                    <label for="department">Department:</label><br>
                    <select id="department" name="department" required>
                        <option value="">Select your department</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Information Systems">Information Systems</option>
                        <option value="Cyber Security">Cyber Security</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Information and Communication Technology">Information and Communication Technology</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email address"
                           autocomplete="email" required>
                </div>

                <br>

                <div>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone"
                           placeholder="e.g. 08012345678"
                           autocomplete="tel"
                           pattern="0[789][01][0-9]{8}"
                           title="Enter an 11-digit Nigerian mobile number, e.g. 08012345678."
                           required>
                </div>

                <br>

                <fieldset>
                    <legend>Gender:</legend>
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </fieldset>

                <br>

                <div>
                    <label for="programme">Programme:</label><br>
                    <select id="programme" name="programme" required>
                        <option value="">Select your programme</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Weekday">Weekday</option>
                        <option value="Weekend">Weekend</option>
                    </select>
                </div>

                <br>
                <hr>
                <br>

                <button type="submit">Submit Registration</button>
                <button type="reset">Clear Form</button>
            </form>
        </section>
    </main>
</body>
</html>
